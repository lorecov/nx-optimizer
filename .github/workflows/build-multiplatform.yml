name: Build multiplatform

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows
          os: windows-2022
        - name: Linux
          os: ubuntu-22.04
        - name: MacOS Intel
          os: macos-15-intel
        - name: MacOS Silicon
          os: macos-latest
        - name: Linux ARM64
          os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11.3
      uses: actions/setup-python@v3
      with:
        python-version: "3.11.3"
    - name: Install dependencies
      run: |
        cd ./src/
        python -m pip install --upgrade pip
        python dependencies.py
    - name: Build ${{ matrix.name }}
      run: |
        cd ./src/
        python ./compile_onedir.py
      if: ${{ startsWith(matrix.name, 'MacOS') }}
    - name: Build ${{ matrix.name }}
      run: |
        cd ./src/
        python ./compile.py
      if: ${{ !startsWith(matrix.name, 'MacOS') }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: ./src/dist
        retention-days: 7
        archive: false
